/* ===== Token pricing (USD / 1M tokens) ===== */
/* cached_input: price for prompt-cache-hit tokens (used by cost_utils for actual cost) */
const _tokenPricing = {

    'gpt-5.4':                  { input: 2.50, cached_input: 0.25, output: 15.00 },
    'gpt-5.4-mini':             { input: 0.75, cached_input: 0.075, output: 4.50 },

    // OpenAI — GPT-5.x older
    'gpt-5.2':                  { input: 1.75, cached_input: 0.175, output: 14.00 },
    'gpt-5-mini':               { input: 0.25, cached_input: 0.025, output: 2.00 },
    // OpenAI — GPT-4.1 series
    'gpt-4.1':                  { input: 2.00, cached_input: 0.50, output: 8.00 },
    // Google Gemini 3.1
    'gemini-3.1-pro-preview':   { input: 2.00, cached_input: 0.20, output: 12.00 },
    'gemini-3.1-flash-lite-preview': { input: 0.25, cached_input: 0.025, output: 1.50 },
    // Google Gemini 3
    'gemini-3-pro-preview':     { input: 2.00, cached_input: 0.20, output: 12.00 },
    'gemini-3-flash-preview':   { input: 0.50, cached_input: 0.05, output: 3.00 },
    // Anthropic (via OpenRouter)
    'anthropic/claude-opus-4.6':   { input: 5.00, cached_input: 0.50, output: 25.00 },
    'anthropic/claude-sonnet-4.6': { input: 3.00, cached_input: 0.30, output: 15.00 },
    // MiniMax (via OpenRouter)
    'minimax/minimax-m2.7':     { input: 0.30, cached_input: 0.15, output: 1.20 },
    // Zhipu (via OpenRouter)
    'z-ai/glm-5.1':            { input: 0.95, cached_input: 0.475, output: 3.15 },
};
const _defaultPricing = { input: 2.00, cached_input: 0.50, output: 8.00 };

/* ===== Model display metadata (for dropdown tags in cost_estimate) ===== */
/* price: input price shorthand ($/1M tokens), date: release month */
const _modelMeta = {
    'gpt-5.4':                  { price: '2.50', date: '2026-02' },
    'gpt-5.4-mini':             { price: '0.75', date: '2026-02' },
    'gpt-5.4-nano':             { price: '0.20', date: '2026-02' },
    'gpt-5.2':                  { price: '1.75', date: '2025-12' },
    'gpt-4.1':                  { price: '2.00', date: '2025-04' },
    'gemini-3.1-pro-preview':   { price: '2.00', date: '2026-02' },
    'gemini-3.1-flash-lite-preview': { price: '0.25', date: '2026-02' },
    'gemini-3-pro-preview':     { price: '2.00', date: '2025-09' },
    'gemini-3-flash-preview':   { price: '0.50', date: '2025-09' },
    'anthropic/claude-opus-4.6':   { price: '5.00', date: '2026-02' },
    'anthropic/claude-sonnet-4.6': { price: '3.00', date: '2026-02' },
    'minimax/minimax-m2.7':     { price: '0.30', date: '2026-04' },
    'z-ai/glm-5.1':            { price: '0.95', date: '2026-04' },
};

/* ===== Pricing a usage dict — shared by every page that includes this table ===== */
function _priceFor(model) {
    /* A recorded model name may carry how it was routed: `deepseek:deepseek-flash` names a
       provider, `openai/gpt-5.4-mini` is OpenRouter's id. Both price as the bare model. */
    const bare = model.replace(/^[a-z]+:/, '');
    return _tokenPricing[model] || _tokenPricing[bare] || _tokenPricing[bare.replace(/^openai\//, '')] || null;
}

function _unpricedModels(usageDict) {
    return Object.keys(usageDict || {}).filter(m => !_priceFor(m));
}

function _calcUsageCost(usageDict) {
    /* Calculate USD cost from {model: {input_tokens, output_tokens, input_token_details?}}
       input_token_details.cache_read uses discounted rate, rest uses full price.
       A model with no price adds nothing — see _costLabel for how that is shown. */
    let cost = 0;
    if (!usageDict) return cost;
    for (const [model, usage] of Object.entries(usageDict)) {
        const p = _priceFor(model);
        if (!p) continue;
        const totalInput = usage.input_tokens || 0;
        const cachedInput = usage.input_token_details?.cache_read || 0;
        const freshInput = totalInput - cachedInput;
        cost += freshInput * p.input / 1e6;
        cost += cachedInput * (p.cached_input ?? p.input) / 1e6;
        cost += (usage.output_tokens || 0) * p.output / 1e6;
    }
    return cost;
}

/* A total that leaves out unpriced models says so: "—" if nothing was priced, "≥ $x" otherwise */
function _costLabel(usd, unpriced) {
    if (!unpriced || unpriced.length === 0) return _formatCost(usd);
    return usd > 0 ? '≥ ' + _formatCost(usd) : '—';
}

function _formatCost(usd) {
    if (usd === 0) return '—';
    if (usd < 0.001) return '<$0.001';
    if (usd < 0.01) return '$' + usd.toFixed(4);
    if (usd < 1) return '$' + usd.toFixed(3);
    if (usd < 100) return '$' + usd.toFixed(2);
    return '$' + Math.round(usd);
}

</script>
